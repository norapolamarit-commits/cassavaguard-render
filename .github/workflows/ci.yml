name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q backend migrations serve.py
      # Production serves the primary CNN only. Auxiliary/fusion artifacts are
      # intentionally disabled until they are retrained against the current CNN.
      - run: python backend/training/verify_artifacts.py --cnn-only
      - run: python backend/training/quality_gate.py
      - run: python -m pytest -q

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- frontend/dist

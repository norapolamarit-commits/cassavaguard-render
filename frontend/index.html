  <style>
    /* =====================================================================
       CassavaGuard design system — bright, friendly, big-card (redesign)
       Single source of truth: CSS variables per theme, shared classes below.
       ===================================================================== */
    :root{
      color-scheme: light;
      /* Warm homestead palette: ivory/cream ground + terracotta as a true second
         primary (not a rare accent), warmed shadow tone. Replaces the cooler
         green-and-white system from the previous pass. */
      --cg-bg:#faf3e6; --cg-bg-tint1:rgba(230,140,50,.10); --cg-bg-tint2:rgba(58,143,74,.09);
      --cg-surface:#fffdf8; --cg-surface-2:#f6ead4; --cg-surface-3:#f0dfc0;
      --cg-text:#2b2013; --cg-text-soft:#6b5c47; --cg-text-dim:#96876e;
      --cg-brand:#3a8f4a; --cg-brand-strong:#2c7239; --cg-brand-ink:#1f5228;
      --cg-brand-soft:rgba(58,143,74,.13); --cg-brand-softer:rgba(58,143,74,.07);
      --cg-warm:#d9711f; --cg-warm-soft:rgba(217,113,31,.15); --cg-warm-ink:#93440c;
      --cg-ok:#3a8f4a; --cg-warn:#d9711f; --cg-danger:#c4432f;
      --cg-border:rgba(90,60,20,.13); --cg-border-soft:rgba(90,60,20,.08);
      --cg-shadow:0 14px 34px -20px rgba(90,55,15,.28);
      --cg-shadow-lg:0 24px 60px -28px rgba(90,55,15,.36);
      --cg-radius:24px; --cg-radius-sm:16px; --cg-radius-xs:13px;
      --cg-grad:linear-gradient(125deg,#2c7239,#3a8f4a 55%,#5aa860);
      --cg-grad-warm:linear-gradient(125deg,#d9711f,#e89a3c);
    }
    html.dark{
      color-scheme: dark;
      --cg-bg:#1a140c; --cg-bg-tint1:rgba(217,113,31,.08); --cg-bg-tint2:rgba(90,168,96,.09);
      --cg-surface:#241b10; --cg-surface-2:#2f2415; --cg-surface-3:#3a2c19;
      --cg-text:#f3ead9; --cg-text-soft:#c1af92; --cg-text-dim:#8f7e64;
      --cg-brand:#5aa860; --cg-brand-strong:#4a9251; --cg-brand-ink:#a3e0a8;
      --cg-brand-soft:rgba(90,168,96,.18); --cg-brand-softer:rgba(90,168,96,.10);
      --cg-warm:#e89a3c; --cg-warm-soft:rgba(232,154,60,.18); --cg-warm-ink:#f6c27a;
      --cg-border:rgba(220,180,130,.16); --cg-border-soft:rgba(220,180,130,.10);
      --cg-shadow:0 18px 44px -22px rgba(0,0,0,.6);
      --cg-shadow-lg:0 28px 70px -30px rgba(0,0,0,.72);
      --cg-grad:linear-gradient(125deg,#3a7c42,#5aa860 55%,#78bd7c);
      --cg-grad-warm:linear-gradient(125deg,#c76e1c,#e89a3c);
    }
    html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
    body { font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
           font-size:17px; line-height:1.58; -webkit-font-smoothing:antialiased; margin:0; min-height:100vh; color:var(--cg-text); }
    html[lang="th"] body { font-family:'Sukhumvit Set','Thonburi','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;
           font-size:18px; line-height:1.72; text-rendering:optimizeLegibility; }
    html[lang="th"] button,html[lang="th"] input,html[lang="th"] select,html[lang="th"] textarea{ line-height:1.55; }

    /* ---- Theme surfaces ---- */
    .theme-bg { background:
        radial-gradient(1200px 620px at 92% -10%, var(--cg-bg-tint2), transparent 55%),
        radial-gradient(1000px 560px at -8% 2%, var(--cg-bg-tint1), transparent 55%),
        var(--cg-bg); }

    /* .glass kept as a class name but now a friendly SOLID surface (no blur) */
    .glass { background:var(--cg-surface); border:1px solid var(--cg-border); box-shadow:var(--cg-shadow); }
    .glass-strong { background:var(--cg-surface); border:1px solid var(--cg-border); box-shadow:var(--cg-shadow-lg); }

    .txt      { color:var(--cg-text); }
    .txt-soft { color:var(--cg-text-soft); }
    .txt-dim  { color:var(--cg-text-dim); }
    .hair     { border-color:var(--cg-border); }

    .grad-brand { background:var(--cg-grad); }
    .grad-text  { background:var(--cg-grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .skip-link{ position:fixed; z-index:10000; left:16px; top:12px; transform:translateY(-160%); padding:10px 14px; border-radius:12px; color:#fff; background:var(--cg-brand-strong); font-size:14px; font-weight:800; box-shadow:0 12px 30px rgba(0,0,0,.28); transition:transform .18s ease; }
    .skip-link:focus{ transform:translateY(0); outline:3px solid var(--cg-brand); outline-offset:2px; }
    #main-content:focus{ outline:none; }

    /* ---- Application shell v2: fixed side rail (desktop) + floating pill
       nav (mobile), replacing the old top-header + card-grid dock. No page
       renders its own duplicate title banner any more — the slim topbar
       here is the only place a page name appears. ---- */
    .brand-mark,.page-icon{ display:grid; place-items:center; color:#fff; background:var(--cg-grad); box-shadow:0 12px 26px -12px rgba(27,162,74,.7); }
    .brand-mark{ width:44px; height:44px; border-radius:15px; }
    .page-icon{ width:38px; height:38px; border-radius:13px; }
    .brand-copy{ font-size:12px; color:var(--cg-text-dim); font-weight:600; }
    .brand-orbit{ width:66px; height:66px; border-radius:22px; display:grid; place-items:center; color:#fff; background:var(--cg-grad); box-shadow:0 18px 50px -16px rgba(27,162,74,.9); animation:pulse 1.5s ease-in-out infinite; }

    /* ---- Auth hero art: safe, icon-only composition (no hand-drawn paths) —
       a big leaf badge with smaller leaves floating around it, plus a soft
       dot-grid texture. Used on the login/register screen, desktop and mobile. */
    .auth-dotgrid{ background-image:radial-gradient(var(--cg-border) 1.4px, transparent 1.4px); background-size:22px 22px; }
    .auth-hero-art{ position:relative; width:100%; height:100%; display:grid; place-items:center; }
    .auth-hero-core{ position:relative; width:132px; height:132px; border-radius:38px; display:grid; place-items:center; color:#fff; background:var(--cg-grad); box-shadow:0 26px 60px -20px rgba(58,143,74,.55); transform:rotate(-4deg); animation:floaty 7s ease-in-out infinite; }
    .auth-hero-core::after{ content:''; position:absolute; inset:-14px; border-radius:46px; border:2px dashed var(--cg-brand-soft); }
    .auth-hero-leaf{ position:absolute; display:grid; place-items:center; border-radius:16px; color:var(--cg-brand-strong); background:var(--cg-surface); box-shadow:0 14px 30px -14px rgba(90,55,15,.35); }
    .auth-hero-leaf.l1{ width:56px; height:56px; top:2%; left:6%; animation:floaty 5.5s ease-in-out infinite; animation-delay:.2s; }
    .auth-hero-leaf.l2{ width:44px; height:44px; bottom:10%; left:-2%; color:var(--cg-warm-ink); background:var(--cg-warm-soft); animation:floaty 6.5s ease-in-out infinite; animation-delay:.6s; }
    .auth-hero-leaf.l3{ width:50px; height:50px; bottom:0; right:4%; animation:floaty 6s ease-in-out infinite; animation-delay:.4s; }
    .auth-hero-leaf.l4{ width:38px; height:38px; top:8%; right:-2%; color:var(--cg-warm-ink); background:var(--cg-warm-soft); animation:floaty 5s ease-in-out infinite; animation-delay:.8s; }
    .auth-mode-badge{ width:44px; height:44px; flex:none; border-radius:14px; display:grid; place-items:center; color:#fff; background:var(--cg-grad); box-shadow:0 12px 24px -12px rgba(58,143,74,.7); }
    /* flex (not grid) so an icon + text child sit in one row instead of
       stacking into separate implicit grid rows. */
    .utility-button{ min-height:50px; padding:0 15px; border-radius:14px; display:inline-flex; align-items:center; justify-content:center; gap:8px; color:var(--cg-text-soft); font-size:14px; font-weight:750; border:1px solid var(--cg-border); background:var(--cg-surface); transition:.18s ease; white-space:nowrap; }
    .utility-button:hover{ border-color:var(--cg-brand); color:var(--cg-brand-strong); }
    .utility-button.square{ width:50px; padding:0; }

    /* Desktop: fixed left icon+label rail instead of a top nav bar. */
    /* Wide, clearly-labeled rail — icon and text sit side by side at a normal
       reading size, not stacked under a tiny 10px caption. */
    .side-rail{ position:fixed; top:0; left:0; bottom:0; width:248px; z-index:820; display:flex; flex-direction:column; gap:3px; padding:20px 14px; background:var(--cg-surface); border-right:1px solid var(--cg-border-soft); overflow-y:auto; }
    .side-brand{ display:flex; align-items:center; gap:12px; margin-bottom:14px; padding:0 6px; }
    .side-brand-mark{ width:44px; height:44px; flex:none; }
    .side-item{ width:100%; display:flex; align-items:center; gap:14px; padding:13px 14px; border-radius:15px; color:var(--cg-text-soft); font-size:15px; font-weight:700; text-align:left; transition:.16s ease; }
    .side-item:hover{ background:var(--cg-brand-softer); color:var(--cg-brand-strong); }
    .side-item.active{ color:#fff; background:var(--cg-grad); box-shadow:0 10px 22px -10px rgba(58,143,74,.7); }
    .side-item-icon{ width:22px; height:22px; flex:none; }
    .side-rail-spacer{ flex:1; }
    .side-foot{ width:100%; display:flex; flex-direction:column; gap:6px; padding-top:12px; border-top:1px solid var(--cg-border-soft); }
    .side-foot .utility-button{ width:100%; display:flex; align-items:center; justify-content:flex-start; padding:0 14px; gap:12px; text-align:left; }

    /* Slim contextual topbar — replaces the old big gradient "route-heading" banner. */
    .content-topbar{ position:sticky; top:0; z-index:800; display:flex; align-items:center; gap:12px; padding:14px 20px; background:var(--cg-bg); border-bottom:1px solid var(--cg-border-soft); }

    /* Mobile: floating pill nav (single rounded capsule) instead of a card-grid dock. */
    .mobile-pill-nav{ position:fixed; z-index:850; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom)); display:flex; align-items:center; gap:2px; padding:6px; border-radius:999px; background:var(--cg-surface); border:1px solid var(--cg-border); box-shadow:0 20px 48px -16px rgba(24,70,40,.4); }
    .pill-item{ width:52px; height:52px; border-radius:999px; display:grid; place-items:center; color:var(--cg-text-dim); transition:.16s ease; }
    .pill-item.active{ color:var(--cg-brand-strong); background:var(--cg-brand-soft); }
    html.dark .pill-item.active{ color:var(--cg-brand-ink); }
    .pill-item.pill-cta{ width:58px; height:58px; color:#fff; background:var(--cg-grad); box-shadow:0 12px 24px -10px rgba(27,162,74,.85); transform:translateY(-6px); }
    .pill-item.pill-cta.active{ color:#fff; background:var(--cg-grad); }
    .menu-tile{ min-height:112px; padding:16px; border-radius:20px; display:flex; flex-direction:column; align-items:flex-start; justify-content:space-between; gap:10px; text-align:left; color:var(--cg-text-soft); font-size:15px; font-weight:750; border:1px solid var(--cg-border); background:var(--cg-surface); box-shadow:var(--cg-shadow); transition:.18s ease; }
    .menu-tile:hover,.menu-tile.active{ border-color:var(--cg-brand); background:var(--cg-brand-softer); color:var(--cg-brand-strong); transform:translateY(-3px); }
    .menu-tile-icon{ width:44px; height:44px; border-radius:14px; display:grid; place-items:center; color:var(--cg-brand-strong); background:var(--cg-brand-soft); }
    .cassava-model-card{ background-image:radial-gradient(circle at 20% 25%,var(--cg-brand-softer),transparent 40%),radial-gradient(circle at 85% 85%,var(--cg-warm-soft),transparent 38%); }
    .model-live-dot{ width:9px; height:9px; border-radius:50%; background:var(--cg-ok); box-shadow:0 0 0 5px rgba(27,162,74,.16); }
    .model-stat{ display:grid; grid-template-columns:1fr auto; gap:7px 12px; align-items:center; padding:14px; border-radius:16px; background:var(--cg-surface-2); border:1px solid var(--cg-border-soft); font-size:14px; }
    .model-meter{ grid-column:1/-1; height:8px; overflow:hidden; border-radius:999px; background:var(--cg-surface-3); }
    .model-meter span{ display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--cg-warm),var(--cg-brand)); transition:width .8s ease; }
    .model-inputs{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; padding:14px; border-radius:16px; background:var(--cg-surface-2); border:1px solid var(--cg-border-soft); }
    .model-inputs label{ min-width:0; display:flex; flex-direction:column; gap:8px; color:var(--cg-text-soft); font-size:13px; font-weight:600; }
    .model-inputs label span{ display:flex; justify-content:space-between; gap:8px; }
    .model-inputs b{ color:var(--cg-brand-strong); white-space:nowrap; }
    .model-weight{ background:var(--cg-brand-softer); border-color:var(--cg-brand-soft); }
    .weight-range{ position:relative; height:25px; padding-top:9px; }
    .weight-range:before{ content:''; position:absolute; left:0; right:0; top:8px; height:6px; border-radius:999px; background:linear-gradient(90deg,#fde68a,var(--cg-brand)); opacity:.85; }
    .weight-range>span{ position:absolute; z-index:1; top:5px; width:3px; height:12px; border-radius:4px; background:var(--cg-brand-ink); box-shadow:0 0 0 3px var(--cg-surface); }
    .weight-range small{ position:absolute; right:0; bottom:0; color:var(--cg-text-dim); font-size:10px; }
    .root-size-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .root-size-grid>div{ min-width:0; padding:12px; border-radius:14px; background:var(--cg-warm-soft); border:1px solid rgba(200,120,40,.18); }
    .root-size-grid span,.root-size-grid b{ display:block; }
    .root-size-grid span{ color:var(--cg-text-soft); font-size:11px; line-height:1.45; }
    .root-size-grid b{ margin-top:3px; color:var(--cg-warm-ink); font-size:14px; }
    .diagnosis-workspace{ padding-top:8px; }
    .diagnosis-intro{ display:flex; justify-content:space-between; align-items:end; gap:28px; padding:18px 4px 4px; }
    .diagnosis-intro h1{ max-width:760px; margin:10px 0 9px; padding-block:3px; font-size:clamp(30px,4vw,52px); line-height:1.12; letter-spacing:-.035em; font-weight:850; }
    html[lang="th"] .diagnosis-intro h1{ line-height:1.3; letter-spacing:-.015em; font-weight:800; }
    .diagnosis-intro p{ max-width:720px; font-size:17px; line-height:1.65; }
    .diagnosis-kicker{ display:inline-flex; align-items:center; gap:7px; color:var(--cg-brand-strong); font-size:12px; letter-spacing:.13em; font-weight:850; }
    .diagnosis-trust{ display:flex; flex-direction:column; gap:8px; flex:0 0 auto; }
    .diagnosis-trust span{ display:flex; align-items:center; gap:7px; padding:10px 13px; border-radius:13px; color:var(--cg-brand-strong); background:var(--cg-brand-soft); font-size:13px; font-weight:750; }
    .workflow-steps{ max-width:720px; margin:4px auto 0; display:grid; grid-template-columns:repeat(3,1fr); padding:0; list-style:none; }
    .workflow-steps li{ position:relative; display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center; color:var(--cg-text-dim); font-size:13px; font-weight:600; }
    .workflow-steps li b{ position:relative; z-index:2; line-height:1.5; }
    .workflow-steps li>span{ z-index:1; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:var(--cg-surface-3); color:var(--cg-text-dim); border:4px solid var(--cg-bg); font-weight:800; }
    .workflow-steps li.active{ color:var(--cg-brand-strong); }
    .workflow-steps li.active>span{ color:#fff; background:var(--cg-grad); }
    .workflow-steps li i{ position:absolute; z-index:0; top:18px; left:50%; right:-50%; height:3px; border-radius:3px; background:var(--cg-border); }
    .workflow-steps li.active i{ background:var(--cg-grad); }
    .diagnosis-tip{ max-width:780px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:9px; padding:12px 18px; border-radius:14px; color:var(--cg-warm-ink); background:var(--cg-warm-soft); border:1px solid rgba(239,157,19,.22); font-size:14px; font-weight:600; }
    .capture-card{ border-radius:28px!important; padding:24px!important; }
    .capture-hero{ background:linear-gradient(160deg, var(--cg-surface) 0%, var(--cg-brand-softer) 130%); }
    /* Compact vertical step list — the side-rail replacement for the old full-width horizontal stepper. */
    .step-rail{ position:relative; list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:4px; }
    .step-rail::before{ content:''; position:absolute; left:23px; top:30px; bottom:30px; width:2px; background:var(--cg-brand); border-radius:999px; }
    .step-rail li{ position:relative; display:flex; align-items:flex-start; gap:12px; padding:10px 4px; }
    .step-rail-dot{ position:relative; width:40px; height:40px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--cg-surface-3); color:var(--cg-text-dim); z-index:1; }
    .step-rail li.active .step-rail-dot{ background:var(--cg-grad); color:#fff; }
    .step-rail li b{ display:block; color:var(--cg-text); font-size:14px; font-weight:750; }
    .step-rail li.active b{ color:var(--cg-brand-strong); }
    .step-rail li p{ margin:2px 0 0; color:var(--cg-text-dim); font-size:12px; }
    .capture-zone{ min-height:400px; padding:28px; border-radius:24px; display:grid; place-items:center; text-align:center; border:2px dashed var(--cg-brand); background:radial-gradient(circle at 50% 42%,var(--cg-brand-softer),transparent 42%),var(--cg-surface-2); transition:.25s ease; }
    .capture-zone:hover,.capture-zone.is-dragging{ transform:translateY(-2px); border-color:var(--cg-brand-strong); box-shadow:inset 0 0 0 4px var(--cg-brand-softer),0 22px 50px -28px rgba(27,162,74,.6); }
    .capture-zone.has-preview{ background:var(--cg-surface-2); border-style:solid; border-color:var(--cg-border); }
    .capture-orb{ position:relative; width:90px; height:90px; margin:0 auto 22px; border-radius:28px; display:grid; place-items:center; color:#fff; background:var(--cg-grad); box-shadow:0 22px 40px -18px rgba(27,162,74,.75); }
    .capture-orb-ring{ position:absolute; inset:-8px; border:2px solid var(--cg-brand-soft); border-radius:33px; animation:pulse 2s ease-in-out infinite; }
    .primary-action,.secondary-action,.analyze-action{ min-height:60px; border-radius:17px; display:flex; align-items:center; justify-content:center; gap:9px; font-size:17px; font-weight:800; transition:.2s ease; }
    .primary-action,.analyze-action{ color:#fff; background:var(--cg-grad); box-shadow:0 16px 30px -18px rgba(27,162,74,.9); }
    .secondary-action{ color:var(--cg-text); background:var(--cg-surface-2); border:1px solid var(--cg-border); }
    .primary-action:hover,.secondary-action:hover,.analyze-action:hover{ transform:translateY(-1px); filter:brightness(1.04); }
    .secondary-action:hover{ border-color:var(--cg-brand); }
    .analyze-action{ width:100%; margin-top:16px; }
    .evidence-panel{ padding:16px; border-radius:18px; border:1px solid var(--cg-border-soft); background:var(--cg-surface-2); }
    .add-evidence-button{ width:100%; min-height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:8px; color:var(--cg-brand-strong); border:2px dashed var(--cg-brand); background:var(--cg-brand-softer); font-size:14px; font-weight:800; }
    .evidence-photo{ display:grid; grid-template-columns:56px 1fr 40px; align-items:center; gap:10px; padding:9px; border-radius:14px; background:var(--cg-surface); border:1px solid var(--cg-border-soft); }
    .evidence-photo img{ width:56px; height:56px; border-radius:12px; object-fit:cover; }
    .evidence-photo button{ width:38px; height:38px; border-radius:11px; display:grid; place-items:center; color:var(--cg-text-soft); background:var(--cg-surface-3); }
    html.chat-modal-open{ overflow:hidden; }
    .advice-chat{ position:fixed; right:22px; bottom:22px; z-index:950; display:flex; flex-direction:column; align-items:flex-end; gap:12px; }
    .advice-chat.open{ inset:0; padding:22px; justify-content:flex-end; pointer-events:none; }
    .advice-chat-backdrop{ position:absolute; inset:0; z-index:-1; pointer-events:auto; cursor:default; background:rgba(2,8,16,.28); backdrop-filter:blur(2px); }
    .advice-chat.open .advice-chat-panel,.advice-chat.open .advice-chat-fab{ pointer-events:auto; }
    .advice-chat-fab{ min-height:56px; padding:0 20px; border-radius:20px; display:flex; align-items:center; gap:9px; color:white; font-weight:800; font-size:15px; background:var(--cg-grad); box-shadow:0 18px 40px -15px rgba(27,162,74,.8); }

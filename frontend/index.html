<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <title>CassavaGuard AI — Precision Agriculture Platform</title>
  <meta name="description" content="AI-powered precision agriculture platform for cassava monitoring, disease diagnosis, satellite & soil analytics, and evidence-based agronomy decision support." />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="./dist/app.css?v=20260731-live-data" />

  <script src="./vendor/react.js"></script>
  <script src="./vendor/prop-types.js"></script>
  <script src="./vendor/react-dom.js"></script>
  <script src="./vendor/chart.js"></script>
  <script src="./vendor/leaflet/leaflet.js"></script>

  <style>
    :root { color-scheme: dark; }
    html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
    body { font-family:Inter,'Sukhumvit Set','Noto Sans Thai','Sarabun',-apple-system,BlinkMacSystemFont,sans-serif;
           -webkit-font-smoothing:antialiased; margin:0; min-height:100vh; }

    /* ---- Theme surfaces ---- */
    .theme-bg { background:
        radial-gradient(1100px 600px at 90% -8%, rgba(6,182,212,.10), transparent 55%),
        radial-gradient(900px 520px at -5% 5%, rgba(16,185,129,.12), transparent 55%),
        #060b16; }
    html.light .theme-bg { background:
        radial-gradient(1000px 560px at 92% -8%, rgba(6,182,212,.14), transparent 55%),
        radial-gradient(820px 480px at -5% 4%, rgba(16,185,129,.16), transparent 55%),
        #eef2f6; }
    html.light { color-scheme: light; }

    .glass { background:rgba(17,26,43,.62); backdrop-filter:blur(16px) saturate(140%);
             -webkit-backdrop-filter:blur(16px) saturate(140%);
             border:1px solid rgba(148,163,184,.14); }
    html.light .glass { background:rgba(255,255,255,.72); border:1px solid rgba(15,23,42,.08);
             box-shadow:0 10px 30px -14px rgba(15,42,66,.18); }
    .glass-strong { background:rgba(12,19,33,.86); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
             border:1px solid rgba(148,163,184,.16); }
    html.light .glass-strong { background:rgba(255,255,255,.9); border:1px solid rgba(15,23,42,.08); }

    .txt      { color:#e5edf7; } html.light .txt      { color:#0b1a2b; }
    .txt-soft { color:#93a4bd; } html.light .txt-soft { color:#5b6b82; }
    .txt-dim  { color:#5f7291; } html.light .txt-dim  { color:#7a8aa0; }
    .hair     { border-color:rgba(148,163,184,.14); } html.light .hair { border-color:rgba(15,23,42,.08); }

    .grad-brand { background:linear-gradient(120deg,#10b981,#06b6d4); }
    .grad-text  { background:linear-gradient(120deg,#34d399,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; }

    /* scrollbars */
    ::-webkit-scrollbar{ width:9px; height:9px; }
    ::-webkit-scrollbar-thumb{ background:rgba(148,163,184,.28); border-radius:9px; }
    ::-webkit-scrollbar-track{ background:transparent; }

    /* range slider */
    input[type=range]{ -webkit-appearance:none; appearance:none; height:6px; border-radius:9999px;
      background:linear-gradient(90deg,#10b981,#06b6d4); outline:none; }
    input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:9999px;
      background:#fff; border:4px solid #10b981; box-shadow:0 2px 8px rgba(0,0,0,.4); cursor:pointer; }

    /* leaflet dark tuning */
    .leaflet-container{ background:#0a1424; font-family:inherit; }
    html.light .leaflet-container{ background:#dbe6ee; }
    .leaflet-popup-content-wrapper,.leaflet-popup-tip{ background:#0f1a2e; color:#e5edf7; border:1px solid rgba(148,163,184,.2); }
    html.light .leaflet-popup-content-wrapper,html.light .leaflet-popup-tip{ background:#fff; color:#0b1a2b; }
    .leaflet-bar a{ background:#111a2b; color:#cbd5e1; border-color:rgba(148,163,184,.2); }
    html.light .leaflet-bar a{ background:#fff; color:#334155; }

    .skeleton{ position:relative; overflow:hidden; background:rgba(148,163,184,.12); }
    .skeleton::after{ content:''; position:absolute; inset:0; transform:translateX(-100%);
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent); animation:shimmer 1.6s infinite; }
    .card-hover{ transition:transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s; }
    .card-hover:hover{ transform:translateY(-4px); box-shadow:0 18px 40px -18px rgba(6,182,212,.35); }
    .no-scrollbar::-webkit-scrollbar{ display:none; }
    canvas{ max-width:100%; }
  </style>
</head>
<body>
  <div id="root" class="theme-bg"></div>

  <script src="./dist/app.js?v=20260731-live-data"></script>
</body>
</html>
